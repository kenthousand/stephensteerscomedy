# DigitalOcean App Platform spec — deploy with:
#   New App > pick this GitHub repo > App Platform detects this file, or
#   `doctl apps create --spec .do/app.yaml` if you use the CLI.
#
# App Platform's free tier only covers static sites, not a Python service
# like this one, so this is a paid setup either way — the cheapest shape
# is the "basic-xxs" web instance (~$5/mo) plus a Dev Database (~$7/mo,
# Postgres, tied to this app), roughly $12/mo total. Change
# `instance_size_slug` / the database's `production` flag below if you
# want more headroom or a standalone production database instead.
#
# The Python buildpack installs requirements.txt automatically for both
# the web service and the release job below — build_command/run_command
# only need the extra steps on top of that.

services:
  - name: web
    github:
      repo: kenthousand/stephensteerscomedy
      branch: main
      deploy_on_push: true
    build_command: python manage.py collectstatic --noinput
    run_command: gunicorn steers_comedy.wsgi:application --bind 0.0.0.0:$PORT
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: DJANGO_SECRET_KEY
        type: SECRET
        value: "REPLACE_ME_before_first_deploy"   # generate with: python -c "import secrets; print(secrets.token_urlsafe(50))"
      - key: DJANGO_DEBUG
        value: "False"
      # Fill in once your domain's connected — comma-separated, e.g.:
      #   DJANGO_ALLOWED_HOSTS = stephensteerscomedy.com,www.stephensteerscomedy.com
      #   DJANGO_CSRF_TRUSTED_ORIGINS = https://stephensteerscomedy.com,https://www.stephensteerscomedy.com
      - key: DJANGO_ALLOWED_HOSTS
        value: ""
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: ""
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_PRIVATE_URL}

# Runs once before each deploy goes live — this is where migrations happen,
# so the running site is never mid-migration.
jobs:
  - name: release
    kind: PRE_DEPLOY
    github:
      repo: kenthousand/stephensteerscomedy
      branch: main
    run_command: python manage.py migrate && python manage.py createcachetable
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_PRIVATE_URL}

databases:
  - name: db
    engine: PG
    production: false
