# Copy to /etc/nginx/sites-available/steers-comedy on the droplet, then
# symlink it into sites-enabled (see the README's droplet setup steps).
# Replace stephensteerscomedy.com / www.stephensteerscomedy.com with your
# real domain if it's different.

server {
    # Drop the two "listen [::]..." lines below if `nginx -t` complains
    # about IPv6 not being supported on your droplet — some base images
    # don't have it enabled.
    listen 80;
    listen [::]:80;
    server_name stephensteerscomedy.com www.stephensteerscomedy.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stephensteerscomedy.com www.stephensteerscomedy.com;

    # Cloudflare Origin Certificate — see the README for how to generate
    # this pair and where to put it. Cloudflare (set to Full or Full
    # strict) is the only thing that should ever see this cert; it isn't
    # trusted by regular browsers on its own, which is fine since visitors
    # never reach this server directly.
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    client_max_body_size 20M;

    location /static/ {
        alias /home/django/steers-comedy-django/staticfiles/;
    }

    location /media/ {
        alias /home/django/steers-comedy-django/media/;
    }

    location / {
        proxy_pass http://unix:/run/steers-comedy.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
